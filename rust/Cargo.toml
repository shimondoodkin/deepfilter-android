[package]
name = "deepfilter_audio"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "staticlib", "lib"]
name = "deepfilter_audio"

[dependencies]
# Flutter-Rust bridge
flutter_rust_bridge = "2"

# DeepFilterNet - use stable release from original repo
df = { git = "https://github.com/Rikorose/DeepFilterNet.git", tag = "v0.5.6", package = "deep_filter", features = ["tract", "default-model"] }

# Audio file I/O
hound = "3.5"

# Utilities
anyhow = "1.0"
thiserror = "1.0"
log = "0.4"
parking_lot = "0.12"
ndarray = "0.15"
once_cell = "1.19"

# Cross-platform audio (for testing on desktop)
[target.'cfg(not(target_os = "android"))'.dependencies]
cpal = "0.15"
env_logger = "0.11"

# Android-specific dependencies
[target.'cfg(target_os = "android")'.dependencies]
oboe = { version = "0.6", features = ["java-interface"] }
jni = "0.21"
android_logger = "0.14"

[profile.release]
lto = true
opt-level = 3
strip = true
